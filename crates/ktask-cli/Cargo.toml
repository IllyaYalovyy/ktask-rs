[package]
name = "ktask-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "ktask-rs"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ktask-core = { path = "../ktask-core", version = "0.1.0" }
ktask-adapters = { path = "../ktask-adapters", version = "0.1.0" }
ktask-tui = { path = "../ktask-tui", version = "0.1.0" }
jiff = "0.2.24"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"

[lints]
workspace = true

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3.27.0"
