[package]
name = "ktask-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "ktask-rs"
path = "src/main.rs"

# `panic_test` is launched only by the terminal-recovery test in `tests/tui/exit.rs`; a
# release build must not ship it. `test-support`, activated below only for test builds
# through the self dev-dependency, keeps it out of a plain `cargo build --release`.
[[bin]]
name = "panic_test"
path = "src/bin/panic_test.rs"
required-features = ["test-support"]

[features]
test-support = []

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ktask-core = { path = "../ktask-core", version = "0.1.0" }
ktask-adapters = { path = "../ktask-adapters", version = "0.1.0" }
ktask-tui = { path = "../ktask-tui", version = "0.1.0" }
jiff = "0.2.24"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"

[lints]
workspace = true

[dev-dependencies]
# Activates `test-support` for test builds only, so `panic_test` is built for `cargo test`
# but absent from a release build.
test-support-of-self = { package = "ktask-cli", path = ".", features = ["test-support"] }
nix = { version = "0.28", features = ["term", "signal"] }
portable-pty = "0.9.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3.27.0"
vt100 = "0.16.2"
