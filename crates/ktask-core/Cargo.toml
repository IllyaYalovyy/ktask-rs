[package]
name = "ktask-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Exposes crate::testing (scratch git repositories) outside this crate's own
# unit tests, e.g. to integration tests elsewhere in the workspace. Off by
# default, so release builds never pull in tempfile.
testing = ["dep:tempfile"]

[dependencies]
thiserror = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
regex = { workspace = true }
toml = { workspace = true }
time = { workspace = true }
nix = { workspace = true }
signal-hook = { workspace = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
