[package]
name = "ktask-rs-mk3"
version = "0.10.1"
edition = "2024"
rust-version = "1.97"
publish = false
default-run = "ktask-dev"
autobins = false

[[bin]]
name = "ktask"
path = "src/bin/ktask.rs"

[[bin]]
name = "ktask-dev"
path = "src/bin/ktask-dev.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.30.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3.27.0"
nix = { version = "0.31", features = ["signal", "process"] }
signal-hook = "0.4"

[dev-dependencies]
portable-pty = "0.9.0"
vt100 = "0.16.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
