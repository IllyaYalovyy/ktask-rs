# Formatting is not a matter of taste here: it is checked, and a violation
# fails the build. Only stable options are used, so `cargo fmt --check` behaves
# identically on every machine.
edition = "2024"
max_width = 100
newline_style = "Unix"
use_field_init_shorthand = true
use_try_shorthand = true
reorder_imports = true
reorder_modules = true
merge_derives = true
remove_nested_parens = true
